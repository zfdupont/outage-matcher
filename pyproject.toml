[project]
name = "outage-matcher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zfdupont", email = "zachary.dupont311@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.7",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain-core>=1.8.0",
    "langfuse>=5.2.0",
    "lxml>=6.1.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
outage-matcher = "outage_matcher.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not db'"
markers = [
    "db: needs a running Postgres with pgvector (skipped by default)",
]
